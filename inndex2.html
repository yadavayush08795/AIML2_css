 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
    /* Outer container representing the margin/wrapper area */
    .outer-box {
      border: 2px solid #666;
      padding: 25px;
      margin: 20px;
      width: 650px;
      font-family: "Times New Roman", Times, serif;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 32px;
      color: #444;
    }

    /* Inner box showing border, padding, and content */
    .inner-box {
      background-color: #d8ed15; /* Yellow content area */
      border: 22px solid #3c54e0; /* Blue border */
      padding: 40px 20px;        /* Inner spacing around text */
      text-align: center;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="outer-box">
    <h1>CSS Box Model</h1>
    <div class="inner-box">
      ABES Engg College Ghaziabad
    </div>
  </div>

</body>
</html>
